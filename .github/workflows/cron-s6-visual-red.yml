name: Cron S6 visual RED
on:
  push:
    branches: [proof/cron-s6-visual-red-5991a9c98]
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: core repair
        run: go test ./internal/tui -run '^Test(CronRunRequestOpensInputForm|CronRequestInput|CronRuntimeRequest|CronClientRequestInputs)' -count=1
      - name: rendering contract
        if: always()
        run: go test ./internal/tui -run '^TestCronRequestInputsRenderForm$' -count=1 -v

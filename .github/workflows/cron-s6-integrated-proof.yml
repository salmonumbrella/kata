name: Cron S6 integrated proof
on:
  push:
    branches: [proof/cron-s6-integrated-20261112]
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./internal/tui -run '^Test(CronRunRequestOpensInputForm|CronRequestInput|CronRuntimeRequest|CronClientRequestInputs|Snapshot_CronRequestInputs)' -count=1
      - run: go test -p 1 ./internal/cron -run 'Input' -count=1
      - run: go test -p 1 ./internal/daemon -run '^TestAPISchemaVersionMatchesRecordedContract$' -count=1

name: Cron S5 integrated final proof
on:
  push:
    branches: [proof/cron-s5-main-final-20261112]
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./cmd/kata ./internal/mcp ./internal/cron ./internal/db ./internal/daemon -run '^Test(CronRequestInputs|CronRequestInputCommands|ParseCronRequestInputs|RequestInputResolution|CronJobInputs)' -count=1
      - run: go test -p 1 ./internal/daemon -run '^TestAPISchemaVersionMatchesRecordedContract$' -count=1
      - run: test -z "$(gofmt -l internal/mcp/cron.go internal/mcp/cron_requests_test.go)"
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make api-generate
      - run: git diff --exit-code -- api/openapi.yaml pkg/client/openapi.yaml pkg/client/generated
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: step-security/setup-bun@f6f5dadeac34f70c7828f731569e8d6e8330b8fb # v2.1.3
        with:
          bun-version: 1.4.4
      - run: make web-install
      - run: make web-generate
      - run: git diff --exit-code -- web/src/lib/api/generated

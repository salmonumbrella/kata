name: MCP cron run usage proof

on:
  push:
    branches: [proof/mcp-cron-run-usage-ci]

permissions:
  contents: read

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 -v ./cmd/kata -run '^TestMCPCronUsage' -count=1
      - if: always()
        run: go test -p 1 -v ./internal/mcp -run 'TestCronRunUsage|TestCronOutputSchemasAreObjects|Test.*(ToolSearch|Section|Catalog)' -count=1
      - if: always()
        run: go test -p 1 -v ./cmd/kata -run 'TestDaemonMCP(CronUsageCatalog|Identity|Mount)' -count=1

name: Cron session rejoin proof

on:
  push:
    branches: [proof/cron-session-rejoin-ci]

permissions:
  contents: read

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace
  KATA_TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable

jobs:
  rejoin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./internal/daemon ./internal/federation -run '^Test(Rejoin|Adoption|FederationAdoption|RebindFederation|FederationRebind|CronAdmissionOutlivesProbeContextAcrossPostgresStores|CronSessionObservation|EnsureFederationReplica(RekeysCredentialBeforeAdoption|RejectsDistinctCredentialAtAdoptionSource|CredentialWriteFailureRetriesAdoption)|ReconcileMapping(ManualH2JoinWinsBeforeH1ReservationWithoutEnrollment|AtomicRekeyCrashBeforeAdoptionReusesHubKeyOnRestart))' -count=1
      - if: always()
        run: go test -p 1 ./internal/cron ./internal/db -run '^Test(SummarySessionsContract|RecurringFeaturesCachePositiveProject)$' -count=1
      - if: always()
        run: go test -p 1 ./internal/db/sqlitestore ./internal/db/pgstore -run '^TestStorageConformance$/^recurring_feature_probe_candidates$' -count=1
      - if: always()
        run: go test -p 1 ./internal/daemon -run '^TestOpenAPICronSummaryIncompleteOnlyAcceptsTrue$' -count=1
      - if: always()
        run: go test -p 1 ./cmd/kata -run '^TestCronCLIObservationSessionsRoundTrip$' -count=1
      - if: always()
        run: go test -p 1 -v ./internal/daemon ./internal/federation ./internal/mcp -run '^(TestCronSessionProbeClassifiesHubFailures|TestRelaySession.*|TestReconcileSessionProbeClassificationAndGuidance|TestReconcileReadOnlyAdoptionGuidance|TestCronRunObserveHelpExplainsSessionReplacement|TestCronRunObserveSessionInputSchema)$' -count=1
      - if: always()
        run: go test -p 1 ./cmd/kata -run '^TestCronCLIRejectsInvalidInputBeforeNetwork$' -count=1
      - if: always()
        run: go test -p 1 -v ./internal/db/sqlitestore ./internal/db/pgstore -run '^TestStorageConformance$/^adoption_session_features$' -count=1
      - if: always()
        run: go test -p 1 ./internal/federation -run '^TestFederationClientSignsRelayBatchAbovePreviousBodyLimit$' -count=1

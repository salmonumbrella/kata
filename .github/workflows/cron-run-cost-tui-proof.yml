name: Cron run cost TUI proof

on:
  push:
    branches: [proof/cron-run-cost-tui-ci]

permissions:
  contents: read

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace

jobs:
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 -v ./internal/tui -run '^TestCronRunUsage' -count=1
      - if: always()
        run: go test -p 1 -v ./internal/tui -run '^TestSnapshot_Cron' -count=1
      - if: always()
        run: go test -p 1 ./internal/tui -run 'Cron' -count=1
      - if: always()
        run: go test -p 1 -v ./internal/agentsview -count=1
      - if: always()
        run: go test -p 1 -v ./cmd/kata -run '^(TestCronUsageOutputStatesAndSanitization|TestCronUsageCommandOutputAndRefresh)$' -count=1

  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 -v ./internal/tui -run '^TestSnapshot_CronRunCost$' -count=1 -update-goldens
      - run: |
          git status --short internal/tui/testdata/golden
          for f in internal/tui/testdata/golden/cron-run-cost-*.txt; do printf '== %s\n' "$f"; cat "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cron-run-cost-goldens
          path: internal/tui/testdata/golden/cron-run-cost-*.txt
          if-no-files-found: error

  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux librsvg2-bin fonts-dejavu-core
      - run: |
          go install github.com/charmbracelet/freeze@v0.2.2
          echo "FREEZE=$(go env GOPATH)/bin/freeze" >> "$GITHUB_ENV"
      - run: bash .github/proof/cron-run-cost-capture.sh
        env:
          BEFORE_SHA: 025423ab77d8ba804be19b238a9c9a33f6ac4b11
          AFTER_SHA: 278adff51f537bd8962a1dc8349c41368a9c1e51
          OUT: ${{ runner.temp }}/cron-run-cost-capture
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cron-run-cost-capture
          path: ${{ runner.temp }}/cron-run-cost-capture
          if-no-files-found: error

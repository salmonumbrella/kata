name: Cron S5 round 3 proof
on:
  push:
    branches: [proof/cron-s5-fix3-stage-20261112, proof/cron-s5-fix3-final-20261112]
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  KATA_HOME: /tmp/kata-proof/home
  KATA_DB: /tmp/kata-proof/home/kata.db
  KATA_WORKSPACE: /tmp/kata-proof/workspace
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./cmd/kata ./internal/mcp ./internal/cron ./internal/db ./internal/daemon -run '^Test(CronRequestInputs|CronRequestInputCommands|ParseCronRequestInputs|RequestInputResolution|CronJobInputs|ResolveInputs)' -count=1
      - run: go test -p 1 ./internal/cron -run Input -count=1
      - run: go test -p 1 ./internal/daemon -run '^TestAPISchemaVersionMatchesRecordedContract$' -count=1
  stores:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: kata_test
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kata -d kata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./internal/db/sqlitestore -run '^TestCronRequestResolutionEvidenceQueries$' -count=1 -v
      - run: go test -p 1 ./internal/db/sqlitestore ./internal/db/pgstore -run '^TestStorageConformance/cron_request_reads$' -count=1 -v
        env:
          KATA_TEST_FAST_SQLITE: '1'
          PGPASSWORD: kata
          KATA_TEST_POSTGRES_DSN: postgres://kata@127.0.0.1:5432/kata_test?sslmode=disable
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          gofmt -w internal/cron/inputs.go internal/cron/inputs_test.go internal/daemon/handlers_cron_definitions.go internal/db/cron_requests.go internal/db/cron_requests_sql.go internal/db/dbtest/conformance_cron_request_reads.go internal/db/dbtest/relay_cron_replay.go internal/db/sqlitestore/cron_resolution_cost_test.go internal/mcp/cron.go internal/mcp/cron_requests.go
          git diff --binary > /tmp/s5-fix3-format.patch
          test ! -s /tmp/s5-fix3-format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: s5-fix3-format
          path: /tmp/s5-fix3-format.patch
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML
      - run: python3 docs/scripts/check_frontmatter.py

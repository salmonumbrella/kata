name: Cron S6 core proof
on:
  push:
    branches: [proof/cron-s6-core-red-c0b46b7fe]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      KATA_HOME: /tmp/kata-proof/home
      KATA_DB: /tmp/kata-proof/home/kata.db
      KATA_WORKSPACE: /tmp/kata-proof/workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test ./internal/tui -run '^TestCronRunRequestOpensInputForm$' -count=1
